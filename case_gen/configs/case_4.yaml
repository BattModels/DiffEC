# Case 4 — NE-wrong-sign at high concentration.
#
# Regime intent (docs/plan/case-design.md §"Case 4"):
#   Companion to case_3 at higher concentration. True t+0(c) is deeply
#   negative throughout c_grid ([-0.20, -0.18] in c_grid [2.93, 3.20]),
#   so lab-frame agents (which structurally recover positive t+0_NE)
#   fail catastrophically on check #2 and check #6.
#
# Originally scoped as a "multi-modal basin trap" for single-start
# BFGS optimization: two well-separated basins (positive-t+0 lab-frame
# vs negative-t+0 moving-frame) with the wrong basin near a
# literature-prior init. In practice, our reference solver's joint
# c+v inverse reliably finds the correct negative basin from a
# +0.30 init — the trap does not materialize with v_data-weighted
# joint fitting. Renamed to reflect what the case actually tests.
# See docs/plan/case-design.md §"Case 4" and docs/session.md
# (2026-06-25) for the design-vs-actual story.
#
# Discrimination vs case_3:
# - case_3: c_init=2.5, c_grid [2.42, 2.69], V_bar override 2.5e-4.
# - case_4: c_init=3.0, c_grid [2.93, 3.20], V_bar rho-derived (~1.32e-4).

case_id: case_4
description: "NE-wrong-sign at high c: deeply negative t+0 throughout c_grid; lab-frame agents fail checks #2/#6 catastrophically."
seed: 45678

# --- Geometry ----------------------------------------------------------
geometry:
  L_cm: 0.3
  Nx: 100

# --- Time --------------------------------------------------------------
time:
  T_s: 1100.0
  dt_s: 0.1
  Nt_out: 50

# --- Initial condition -------------------------------------------------
initial:
  c_init: 3.0     # mol/L, middle of c_grid

# --- Material polynomials ---------------------------------------------
material:
  M0_g_per_mol: 44.05
  M_g_per_mol: 287.09
  T_temp_K: 363.15
  rho_polynomial:
    a: 1.123276
    b: 0.106822
    d: 0.007606
  # Realistic V_bar at c_avg=3.0 ~ 1.3e-4 m^3/mol (rho-derived).

  # D(c): smoothly decreasing with a shoulder/plateau near c=3.0
  # (case_4 c_grid sits inside this plateau, so D varies only ~4 %
  # across c_grid — well-matched to a 10-knot piecewise-linear fit
  # spanning the wider c_data range).
  D_table_cgs:
    c_mol_per_L: [0.0,    0.5,    1.0,    1.5,    2.0,    2.5,    3.0,    3.5,    4.0]
    D_cm2_per_s: [1.5e-6, 1.2e-6, 9.0e-7, 6.5e-7, 4.5e-7, 3.8e-7, 3.6e-7, 3.0e-7, 2.5e-7]
  # t+0(c): moderately negative across c_grid with non-monotone
  # recovery at very high c. Magnitude is SHALLOWER than the published
  # Steinrück fit at c >= 2.9 — designed to land at least 0.10 above
  # Steinrück's line at every c_grid point (avoids ADR-0004 lookup
  # attack). In c_grid [2.93, 3.20] true tp0 spans roughly
  # [-0.18, -0.20] — clearly negative for the NE_wrong_sign
  # discriminator, but distinct from any literature linear fit.
  tp0_table:
    c_mol_per_L: [0.0,  0.5,  1.0,  1.5,  2.0,   2.5,   3.0,   3.5,   4.0]
    tp0:         [0.40, 0.30, 0.20, 0.05, -0.05, -0.15, -0.20, -0.15, -0.10]

# --- Applied current schedule -----------------------------------------
current:
  schedule: ramp_hold_ramp
  peak_A_per_cm2: 3.2e-3      # 32 A/m^2 (same as original case_3)
  ramp_up_s: 100.0
  hold_s: 900.0
  ramp_down_s: 100.0

# --- Reporting grids ---------------------------------------------------
# c_grid in deep-negative-tp0 region. c_init = 3.0 sits inside c_grid
# so data density supports the reporting grid (per case_3 lesson).
# Narrowed from [2.70, 3.30] to [2.85, 3.22] to exclude the lab-frame
# tp_NE zero crossings (~ c=2.81 and c=3.27) — those would cause
# regime label flips between oracle and agent NE-inversion
# implementations at the crossings (case_3-style borderline issue).
# Inside [2.85, 3.22]: oracle tp_NE > 0 robustly, true tp < 0 -> all
# NE_wrong_sign labels stable.
c_grid:
  c_min: 2.93
  c_max: 3.20
  n: 50

flux_samples:
  n: 10
  x_min_frac: 0.2
  x_max_frac: 0.8
  t_min_frac: 0.3
  t_max_frac: 0.9

# --- Noise model -------------------------------------------------------
noise:
  c_sigma_mol_per_L: 0.018    # ~0.6 % at c_init=3.0
  v_sigma_rel: 0.05

# --- Invert-NE parameters ---------------------------------------------
invert_ne:
  lambda_reg: 1.0e-3
  init_tp0: 0.30
  maxiter: 200
