# Case 4 — NE-transition: t+0 sign crossing inside the graded band.
#
# Regime intent (ADR-0013; docs/plan/case-design.md §"Case 4"):
#   The true t+0(c) crosses zero INSIDE c_grid (c* ~ 3.02 mol/L, between
#   grid points), while the emergent lab-frame t+0_NE stays well positive
#   across the band. The 50 labels therefore split into an NE_deviates
#   block (low-c side, t+0 > 0), a masked band around the crossing
#   (|t+0_oracle| < 0.03 is excluded from label grading — see
#   generate.REGIME_MASK_MIN_ABS_TP0 and formalism.md §4), and an
#   NE_wrong_sign block (high-c side, t+0 < 0). Recovering the block
#   boundary requires locating the sign crossing to ~±0.03 mol/L, i.e.
#   pointwise t+0 accuracy ~0.03 near c* — sharper than check #2's 0.05.
#   This makes the NE inversion and the local t+0 shape load-bearing;
#   labels are no longer implied by getting the case's overall regime
#   right.
#
# History: v1 of this case ("NE-wrong-sign at high c", t+0 in
# [-0.20, -0.18] across c_grid) duplicated case_3's discriminator after
# its original basin-trap intent was dropped (2026-06-25). Redesigned
# 2026-09-09 per ADR-0013 after Opus-5 passed 3/3 reviewer trials.
#
# t+0 truth shape: gentle decline to a knee at c = 2.85 (below the graded
# band), then a steep linear drop (slope -1.0 per mol/L) through zero at
# c* = 3.02, leveling off above 3.35. On the graded band [2.93, 3.20] the
# truth runs from +0.09 down to -0.18. The steep slope keeps the masked
# band narrow (|t+0| < 0.03 spans ~0.06 mol/L ~ 11 of 50 grid points).
#
# Discrimination vs case_3:
# - case_3: c_init=2.5, c_grid [2.42, 2.69], deeply negative throughout.
# - case_4: c_init=3.0, c_grid [2.93, 3.20], sign crossing inside the band,
#   V_bar rho-derived (~1.32e-4).

case_id: case_4
description: "NE-transition: t+0 crosses zero inside c_grid; agents must locate the NE_deviates -> NE_wrong_sign label boundary, which needs local t+0 accuracy sharper than check #2."
seed: 45678

# --- Geometry ----------------------------------------------------------
geometry:
  L_cm: 0.3
  Nx: 100

# --- Time --------------------------------------------------------------
time:
  T_s: 1100.0
  dt_s: 0.1
  Nt_out: 50

# --- Initial condition -------------------------------------------------
initial:
  c_init: 3.0     # mol/L, just below the t+0 sign crossing at c* ~ 3.02

# --- Material polynomials ---------------------------------------------
material:
  M0_g_per_mol: 44.05
  M_g_per_mol: 287.09
  T_temp_K: 363.15
  rho_polynomial:
    a: 1.123276
    b: 0.106822
    d: 0.007606
  # Realistic V_bar at c_avg=3.0 ~ 1.3e-4 m^3/mol (rho-derived).

  # D(c): unchanged from v1 — smoothly decreasing with a shoulder/plateau
  # near c=3.0 (c_grid sits inside this plateau, so D varies only ~4 %
  # across c_grid — well-matched to a 10-knot piecewise-linear fit
  # spanning the wider c_data range).
  D_table_cgs:
    c_mol_per_L: [0.0,    0.5,    1.0,    1.5,    2.0,    2.5,    3.0,    3.5,    4.0]
    D_cm2_per_s: [1.5e-6, 1.2e-6, 9.0e-7, 6.5e-7, 4.5e-7, 3.8e-7, 3.6e-7, 3.0e-7, 2.5e-7]
  # t+0(c): positive and gently declining up to the knee at 2.85, then a
  # steep -1.0 per mol/L drop through zero at c* = 3.02 (between grid
  # points 16 and 17 of the 50-point c_grid), leveling off above 3.35.
  # ADR-0004 anti-cheat: the published Steinrück/DiffEC linear fit is
  # deeply negative across [2.93, 3.20]; our +0.09 value at the low-c
  # edge alone puts max pointwise distance >> 0.10 (verified via
  # scripts/litvalue_distance.py after regeneration).
  tp0_table:
    c_mol_per_L: [0.0,  0.5,  1.0,  1.5,  2.0,  2.5,  2.85,  3.35,  3.6,   4.0]
    tp0:         [0.42, 0.38, 0.33, 0.28, 0.24, 0.20, 0.17, -0.33, -0.38, -0.42]

# --- Applied current schedule -----------------------------------------
current:
  schedule: ramp_hold_ramp
  peak_A_per_cm2: 3.2e-3      # 32 A/m^2 (unchanged from v1)
  ramp_up_s: 100.0
  hold_s: 900.0
  ramp_down_s: 100.0

# --- Reporting grids ---------------------------------------------------
# c_grid deliberately spans the t+0 sign crossing (ADR-0013 reverses the
# 2026-06-26 "single-regime band" rule for this case; label determinism
# near the crossing is handled by the truth-side regime_graded mask, not
# by narrowing the band). Emergent t+0_NE must stay robustly positive
# across [2.93, 3.20] — verified at generation time (v1's lab-frame NE
# crossings sat at ~2.81 / ~3.27; re-checked for the new truth).
# c_max extended 3.20 → 3.30 (2026-09-09, post mock trial): a cold
# Opus-5 xhigh run passed with its t⁺⁰ error growing monotonically into
# the sparse high-c tail (0.037 at 3.20, slope-shrinkage from parsimony
# priors) — grading deeper into the sustained-slope region separates
# deliberate weak-regularization inversions (reference: ~0.01 there)
# from default-regularized ones. Still well inside the data-visited
# range (c_data reaches ~4.27; no extrapolated grading).
c_grid:
  c_min: 2.93
  c_max: 3.30
  n: 50

flux_samples:
  n: 10
  x_min_frac: 0.2
  x_max_frac: 0.8
  t_min_frac: 0.3
  t_max_frac: 0.9

# --- Noise model -------------------------------------------------------
noise:
  c_sigma_mol_per_L: 0.018    # ~0.6 % at c_init=3.0
  v_sigma_rel: 0.05

# --- Invert-NE parameters ---------------------------------------------
invert_ne:
  lambda_reg: 1.0e-3
  init_tp0: 0.30
  maxiter: 200
